# Minimal config for vanilla-zmk display isolation test: only what's needed
# to boot and drive the nice_view screens. RGB/EC11/pointing-tuning/backlight/
# debounce/soft-off all stripped since they're not relevant to this test and
# some trip Kconfig warnings-as-errors on zmk main that don't exist on the
# cormoran fork.

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y

CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Mouse enable (keymap uses &mmv/&msc/&mkp)
CONFIG_ZMK_POINTING=y
